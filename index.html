<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Relógio Analógico</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="clock">
    <imagem id="trocarImagem de Relogio analógico" src="imagem/relogio-analogico.png" alt="Relógio analógico">
  </div>

<script src="script.js"></script>
</body>
</html>

<style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #1e1e2f, #2d2d44);
      font-family: 'Segoe UI', Arial, sans-serif;}

       .clock {
      position: relative;
      width: 320px;
      height: 320px;
      background: radial-gradient(circle, #f5f5f5 0%, #d8d8d8 100%);
      border-radius: 50%;
      border: 12px solid #1a1a2e;
      box-shadow:
        0 0 0 6px #6c5ce7,
        0 20px 40px rgba(0, 0, 0, 0.6),
        inset 0 0 30px rgba(0, 0, 0, 0.15);
    }

    .clock .number {
      position: absolute;
      width: 100%;
      height: 100%;
      text-align: center;
      font-size: 22px;
      font-weight: bold;
      color:#01117
      padding-top: 12px;
    }

    .clock .number span {
      display: inline-block;
    }

    .number1  { transform: rotate(30deg);   }
    .number2  { transform: rotate(60deg);   }
    .number3  { transform: rotate(90deg);   }
    .number4  { transform: rotate(120deg);  }
    .number5  { transform: rotate(150deg);  }
    .number6  { transform: rotate(180deg);  }
    .number7  { transform: rotate(210deg);  }
    .number8  { transform: rotate(240deg);  }
    .number9  { transform: rotate(270deg);  }
    .number10 { transform: rotate(300deg);  }
    .number11 { transform: rotate(330deg);  }
    .number12 { transform: rotate(360deg);  }

    .number1 span  { transform: rotate(-30deg);  }
    .number2 span  { transform: rotate(-60deg);  }
    .number3 span  { transform: rotate(-90deg);  }
    .number4 span  { transform: rotate(-120deg); }
    .number5 span  { transform: rotate(-150deg); }
    .number6 span  { transform: rotate(-180deg); }
    .number7 span  { transform: rotate(-210deg); }
    .number8 span  { transform: rotate(-240deg); }
    .number9 span  { transform: rotate(-270deg); }
    .number10 span { transform: rotate(-300deg); }
    .number11 span { transform: rotate(-330deg); }
    .number12 span { transform: rotate(-360deg); }

    .hand {
      position: absolute;
      bottom: 50%;
      left: 50%;
      transform-origin: bottom center;
      transform: translateX(-50%) rotate(0deg);
      border-radius: 10px;
      transition: transform 0.05s cubic-bezier(0.4, 2.5, 0.6, 1);
    }

     .hour-hand {
      width: 8px;
      height: 25%;
      background: #1a1a2e;
      z-index: 3;
    }

       .minute-hand {
      width: 5px;
      height: 35%;
      background: #333;
      z-index: 4;
    }

    .second-hand {
      width: 2px;
      height: 40%;
      background: #e74c3c;
      z-index: 5;
    }

     .second-hand::after {
      content: '';
      position: absolute;
      bottom: -18px;
      left: 50%;
      transform: translateX(-50%);
      width: 8px;
      height: 18px;
      background: #e74c3c;
      border-radius: 4px;
    }
.center-dot {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 16px;
      height: 16px;
      background: #e74c3c;
      border: 3px solid #1a1a2e;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      z-index: 6;
    }
  </style>
</head>
<body>

  <div class="clock">
    <div class="number number1"><span>1</span></div>
<div class="number number2"><span>2</span></div>
    <div class="number number3"><span>3</span></div>
    <div class="number number4"><span>4</span></div>
    <div class="number number5"><span>5</span></div>
    <div class="number number6"><span>6</span></div>
    <div class="number number7"><span>7</span></div>
    <div class="number number8"><span>8</span></div>
    <div class="number number9"><span>9</span></div>
    <div class="number number10"><span>10</span></div>
    <div class="number number11"><span>11</span></div>
    <div class="number number12"><span>12</span></div>

        <div class="hand hour-hand"></div>
    <div class="hand minute-hand"></div>
    <div class="hand second-hand"></div>

      <div class="center-dot"></div>
  </div>

    <script>
    const hourHand   = document.querySelector('.hour-hand');
    const minuteHand = document.querySelector('.minute-hand');
    const secondHand = document.querySelector('.second-hand');

    function updateClock() {
      const now = new Date();

      const seconds = now.getSeconds();
      const minutes = now.getMinutes();
 const hours   = now.getHours();

 const secondsDeg = seconds * 6;                          // 360/60 = 6
      const minutesDeg = minutes * 6 + seconds * 0.1;          // suaviza
      const hoursDeg   = (hours % 12) * 30 + minutes * 0.5;    // 360/12 = 30

      secondHand.style.transform = `translateX(-50%) rotate(${secondsDeg}deg)`;
      minuteHand.style.transform = `translateX(-50%) rotate(${minutesDeg}deg)`;
      hourHand.style.transform   = `translateX(-50%) rotate(${hoursDeg}deg)`;
    }

      updateClock();
    setInterval(updateClock, 1000);

function trocarImagem() {
  document.getElementById('foto de Relogio').src = 'img/relogio-analogico.png';
}
  </script>

</body>
</html>
